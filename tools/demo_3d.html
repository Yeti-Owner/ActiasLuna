<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moth 3D decoy demo</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22cc; --fg:#e6edf3; --muted:#9aa7b4; --on:#2ea043; --off:#30363d; --sim:#f0a83b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { position:fixed; inset:0; }
  #ui { position:fixed; left:16px; top:16px; z-index:10; background:var(--panel); backdrop-filter:blur(6px);
    border:1px solid #30363d; border-radius:12px; padding:14px 16px; max-width:min(90vw,320px); }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:.2px; }
  .sub { font-size:12px; color:var(--muted); margin:0 0 12px; }
  button { font:inherit; font-weight:600; color:#fff; border:0; border-radius:10px; padding:11px 16px;
    width:100%; cursor:pointer; background:var(--off); transition:background .15s; }
  button.on { background:var(--on); }
  button:active { transform:translateY(1px); }
  .stat { margin-top:12px; font-size:13px; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--off); }
  .dot.on { background:var(--on); box-shadow:0 0 10px var(--on); }
  .tag { display:inline-block; margin-top:12px; font-size:11px; font-weight:700; letter-spacing:.3px;
    color:#1a1205; background:var(--sim); border-radius:6px; padding:3px 8px; }
  .hint { margin-top:12px; font-size:11px; color:var(--muted); line-height:1.5; }
  #err { position:fixed; inset:auto 16px 16px 16px; z-index:20; background:#5a1d1d; color:#ffd7d7;
    border-radius:10px; padding:12px 14px; font-size:13px; display:none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <h1>Moth &mdash; room decoy demo</h1>
  <p class="sub">Your scanned room. Turn the crowd on and simulated phones scatter across the real floor.</p>
  <button id="toggle">Turn crowd ON</button>
  <div class="stat"><span class="dot" id="dot"></span><span id="status">Crowd off &mdash; 0 decoys</span></div>
  <span class="tag">SIMULATED &mdash; nothing transmitted</span>
  <p class="hint">Click the button, press the Uno Q white button, or run <code>send_crowd.py</code> &mdash;
    all flip the same crowd.</p>
</div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const errBox = document.getElementById('err');
function fail(msg) { errBox.style.display = 'block'; errBox.textContent = msg; console.error(msg); }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('app').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(3, 6, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4); fill.position.set(-4, 2, -3); scene.add(fill);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// --- decoy markers -------------------------------------------------------------------------------------
const decoyGroup = new THREE.Group();
scene.add(decoyGroup);
const sphereGeo = new THREE.SphereGeometry(0.09, 16, 16);
const stemGeo = new THREE.CylinderGeometry(0.012, 0.012, 1, 8);
const decoyMat = new THREE.MeshStandardMaterial({ color: 0xff5a5a, emissive: 0xff2a2a, emissiveIntensity: 0.8 });
const stemMat = new THREE.MeshBasicMaterial({ color: 0xff5a5a, transparent: true, opacity: 0.5 });
const markers = new Map();      // mac -> { group, target:Vector3 }
const HEAD = 0.95;              // phone height above the floor (m)

function ensureMarker(mac) {
  if (markers.has(mac)) return markers.get(mac);
  const g = new THREE.Group();
  const ball = new THREE.Mesh(sphereGeo, decoyMat);
  ball.position.y = HEAD;
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.scale.y = HEAD; stem.position.y = HEAD / 2;
  g.add(stem); g.add(ball);
  decoyGroup.add(g);
  const m = { group: g, target: new THREE.Vector3() };
  markers.set(mac, m);
  return m;
}

function updateDecoys(decoys) {
  const seen = new Set();
  for (const d of decoys) {
    seen.add(d.mac);
    const m = ensureMarker(d.mac);
    m.target.set(d.x, d.y, d.z);
    if (m.group.position.lengthSq() === 0) m.group.position.copy(m.target); // first placement, no glide
  }
  for (const [mac, m] of markers) {
    if (!seen.has(mac)) { decoyGroup.remove(m.group); markers.delete(mac); }
  }
}

// --- load the room mesh --------------------------------------------------------------------------------
let floorY = 0;
async function loadRoom() {
  const r = await fetch('/room.json'); if (!r.ok) throw new Error('room.json ' + r.status);
  const data = await r.json();
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(data.positions, 3));
  geo.setIndex(data.indices);
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: 0x9fb3c8, roughness: 0.95, metalness: 0.0,
    side: THREE.DoubleSide, transparent: true, opacity: 0.38 });
  scene.add(new THREE.Mesh(geo, mat));

  const mn = data.bbox.min, mx = data.bbox.max;
  floorY = data.floor_y;
  const cx = (mn[0]+mx[0])/2, cy = (mn[1]+mx[1])/2, cz = (mn[2]+mx[2])/2;
  const span = Math.max(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]);
  controls.target.set(cx, cy, cz);
  camera.position.set(cx + span*1.1, cy + span*0.8, cz + span*1.1);
  camera.updateProjectionMatrix();

  // a faint floor grid at the real floor height
  const grid = new THREE.GridHelper(Math.ceil(span)+2, Math.ceil(span)+2, 0x30465c, 0x22303d);
  grid.position.set(cx, floorY + 0.002, cz);
  scene.add(grid);
}

// --- crowd state polling + toggle ----------------------------------------------------------------------
const btn = document.getElementById('toggle');
const dot = document.getElementById('dot');
const statusEl = document.getElementById('status');
let lastOn = null;

function paint(on, count) {
  btn.textContent = on ? 'Turn crowd OFF' : 'Turn crowd ON';
  btn.classList.toggle('on', on);
  dot.classList.toggle('on', on);
  statusEl.textContent = on ? `Crowd on — ${count} simulated decoys` : 'Crowd off — 0 decoys';
}

btn.addEventListener('click', async () => {
  try { const r = await fetch('/toggle'); const j = await r.json(); lastOn = j.on; }
  catch (e) { fail('Could not reach the demo server (/toggle). Is demo_3d.py still running?'); }
});

async function poll() {
  try {
    const r = await fetch('/state.json'); const s = await r.json();
    updateDecoys(s.decoys || []);
    if (s.on !== lastOn) { paint(s.on, s.count); lastOn = s.on; }
    else statusEl.textContent = s.on ? `Crowd on — ${s.count} simulated decoys` : 'Crowd off — 0 decoys';
    errBox.style.display = 'none';
  } catch (e) {
    fail('Lost the demo server. Restart it:  py tools/demo_3d.py');
  }
}

function animate() {
  requestAnimationFrame(animate);
  for (const m of markers.values()) m.group.position.lerp(m.target, 0.15); // glide to new spot
  controls.update();
  renderer.render(scene, camera);
}

loadRoom().then(() => { animate(); poll(); setInterval(poll, 300); })
          .catch(e => fail('Could not load the room: ' + e.message));
</script>
</body>
</html>
